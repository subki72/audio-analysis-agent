[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-analysis-agent"
version = "1.0.0"
description = "VoiceScript — Audio Analysis ReAct Agent & MCP Server powered by FFmpeg and Groq LLM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Muhammad Syafi'i As Subki", email = "subkisyafii@gmail.com" }]
dependencies = [
    "groq==0.37.1",
    "mcp[cli]==1.27.1",
    "pydantic==2.14.4",
    "python-dotenv==1.2.2",
    "pydub==0.25.1",
    "click==8.3.2",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "flake8==7.3.0",
]

[project.scripts]
voicescript = "src.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".git", ".venv", "__pycache__", ".cache", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"src/tools/__init__.py" = ["I001", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
