services:
  audio-analysis-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: audio-analysis-agent:latest
    container_name: audio-analysis-agent
    stdin_open: true
    tty: true
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      MAX_ITERATIONS: ${MAX_ITERATIONS:-10}
      API_TIMEOUT_SECONDS: ${API_TIMEOUT_SECONDS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys; from src.health import check_system_health; res = check_system_health(); sys.exit(0 if res['status'] == 'healthy' else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
