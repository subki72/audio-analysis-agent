name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Code Quality & Lint (Flake8 + Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8==7.3.0 ruff==0.8.4

      - name: Run Flake8 and Ruff Checks
        run: |
          flake8 --max-line-length=120 .
          ruff check src tests mcp_server.py

  test:
    name: Automated Test Suite (Pytest + FFmpeg)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg System Dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Pinned Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest with Coverage Gate
        run: python -m pytest tests/ -v --cov=src --cov-report=term-missing --cov-fail-under=60

  build-and-security:
    name: Docker Build & Security Scans
    needs: [lint-and-typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST Scanner
        uses: returntocorp/semgrep-action@v1
        continue-on-error: true
        with:
          config: p/python

      - name: Build Hardened Docker Image
        run: docker build -t audio-analysis-agent:ci .

      - name: Run Trivy Container Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: audio-analysis-agent:ci
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
